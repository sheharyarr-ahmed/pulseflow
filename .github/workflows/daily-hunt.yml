name: daily-hunt

on:
  schedule:
    # 08:17 UTC = 13:17 PKT. Off-peak minute: GitHub delays or drops
    # on-the-hour schedules under load.
    - cron: '17 8 * * *'
  workflow_dispatch:

# Queue a manual dispatch behind a running cron instead of interleaving.
concurrency:
  group: daily-hunt
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
      - run: uv sync --locked
      - name: Run the hunt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: uv run python scripts/run_hunt.py
      - name: Reset 60-day auto-disable timer
        # Resets the inactivity timer while the workflow is alive; it cannot
        # self-heal once actually disabled. Zero commits, no third-party action.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/daily-hunt.yml/enable
