[project]
name = "pulseflow"
version = "0.1.0"
description = "Code-first workflow orchestration: daily freelance-market job hunt (fetch, filter, score, notify)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sheharyar Ahmed", email = "sheharyar.softwareengineer@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "feedparser",
    "httpx",
    "pydantic",
    "anthropic",
    "supabase",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulseflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
